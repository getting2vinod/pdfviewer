version: '3.8'

services:
  pdf-app:
    hostname: pdf.myapps.localhost
    container_name: pdf.myapps.localhost
    image: python:pdf
    restart: always
    environment:
      - ROUTE_PATH=/pdf
      - DATA_DIR=/app/data
    volumes:
      - ./data:/app/data
      - ./app:/app/app
    ports:
      - "4015:4015"
    networks:
      - net
    
networks:
  net:
    driver: bridge
    external: true

